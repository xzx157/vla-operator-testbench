[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-operator-testbench"
version = "0.1.0"
description = "Model-independent correctness and performance testbench for VLA operators"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "pku-eric-golem"}]
dependencies = []

[project.scripts]
vla-bench = "vla_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
